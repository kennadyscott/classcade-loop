<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>School · ClassCade Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="loop.css?v=66">
</head><body>
<div id="app"></div>
<script src="loop.data.js?v=66"></script>
<script src="loop.engine.js?v=66"></script>
<script src="loop.shell.js?v=66"></script>
<script>
const d = LOOP.child(ME);
let filter = 'all';

function render(){
  if (document.body.classList.contains('sm')) return renderPhone();
  return renderDesktop();
}

/* ── PHONE · sections, in the order a parent needs them ──── */
function renderPhone(){
  document.body.classList.add('darktop');
  const tier = LOOP.store.tier();
  const kid  = FAMILY.find(f=>f.id===ME) || FAMILY[0];

  const head = `
    <div class="m-dark">
      ${brandRow()}
      <div class="m-greetrow">
        <div><div class="m-greet">Hi, ${esc(PARENT.name)}! 👋</div>
        <div class="m-greet-sub">${tier==='connected'?'Everything '+esc(d.poss)+' classroom has seen.':'No classroom connected yet.'}</div></div>
        <div class="m-kidpill" id="kidmenu">
          <div class="av g1" style="width:28px;height:28px;border-radius:9px;font-size:12px">${esc(kid.label[0])}</div>
          <div style="min-width:0"><div class="nm">${esc(kid.label)}</div><div class="mt">${esc(kid.grade)}</div></div>
          <span class="cv">⌄</span>
        </div>
      </div>
      ${headerTabs('school')}
    </div>`;

  if (tier==='family'){
    $('#app').innerHTML = head + `<div class="m-light">
      <div class="m-secrow">Not connected</div>
      <div class="s-card" style="text-align:center">
        <img src="art/loop-monster-sm.png" alt="" style="width:96px;height:auto">
        <h4 style="margin:10px 0 6px">${esc(d.poss.charAt(0).toUpperCase()+d.poss.slice(1))} classroom isn't connected.</h4>
        <p class="small muted">Connect it and everything ${esc(d.first)} already does in Showdown appears here — with no extra work for the teacher.</p>
        <button class="btn primary sm block" style="margin-top:14px" id="conn">🔗 Connect classroom</button>
      </div></div>`;
    wireTopline(); wireC(); return;
  }

  const all  = LOOP.activity(ME, 40);
  const wk   = all.filter(x=>LOOP.thisWeek(x.d));
  const cn   = LOOP.coins(ME);
  const notes= TEACHER_MESSAGES.filter(m=>m.s===ME);
  const evt  = EVENTS_UPCOMING.find(x=>x.s===ME);
  const log  = mergeLog(all, CLASS_UPDATES);

  $('#app').innerHTML = head + `
    <div class="m-light">

      <div class="m-secrow">The classroom</div>
      <div class="s-card">
        <div class="s-class">
          <div class="av2">MA</div>
          <div style="flex:1;min-width:0">
            <h4>Ms. Alvarez</h4>
            <p>3rd Grade · ${ROSTER.length} students · using ClassCade Showdown</p>
          </div>
          ${bog(LOOP.store.boggie(ME),'md','ring')}
        </div>
      </div>

      <div class="m-secrow">Notes home <a href="messages.html">Reply →</a></div>
      <div class="s-card">
        ${notes.length ? notes.map(n=>`
          <div class="s-note">
            <div class="av3">MA</div>
            <div style="flex:1;min-width:0">
              <div style="display:flex;gap:7px;align-items:baseline">
                <span class="who">${esc(n.from)}</span><span class="when">${fmt(n.d)}</span></div>
              <div class="body">${esc(n.body)}</div>
            </div>
          </div>`).join('')
          : '<p class="small muted">Nothing this week. Teacher notes are rare by design.</p>'}
      </div>

      <div class="m-secrow">This week</div>
      <div class="s-meta" style="margin-top:0;padding-top:0;border-top:0">
        <div class="s-stat"><b>${wk.length}</b><span>signals from the classroom</span></div>
        <div class="s-stat"><b style="color:#7a5a00">${cn.total}</b><span>coins earned</span></div>
      </div>

      ${evt?`
      <div class="m-secrow">Upcoming</div>
      <a class="s-card s-up" href="ask.html#conference" style="text-decoration:none;color:inherit">
        <span class="cal"><b>${esc((evt.when.split(' · ')[0].split(' ')[0]||'').toUpperCase())}</b><i>${esc(evt.when.split(' · ')[0].split(' ')[1]||'')}</i></span>
        <span style="flex:1;min-width:0">
          <span style="display:block;font-size:14.5px;font-weight:900;letter-spacing:-.025em">${esc(evt.kind)}</span>
          <span style="display:block;font-size:12.5px;color:var(--muted);margin-top:2px">${esc(evt.when)} · get questions to ask</span>
        </span>
        <span class="chev" style="color:var(--muted-2);font-weight:900">›</span>
      </a>`:''}

      <div class="m-secrow">What happened at school <a href="#" data-filter>Everything ▾</a></div>
      <div class="m-feed">
        ${log.map(x=> x.kind ? classPost(x) : signalRow(x)).join('')}
      </div>
      <p class="m-note">Signals are captured while Showdown runs — Ms. Alvarez fills out nothing.
        Class updates and photos are posted by her for the whole class.</p>
    </div>`;
  wireTopline();
  const f=$('[data-filter]'); if(f) f.onclick=e=>{e.preventDefault();toast('Filters live on the desktop view in this prototype.')};
}

function brandRow(){
  return `<div class="m-brand">
    <svg style="width:17px;height:17px" viewBox="0 0 24 24" aria-hidden="true"><g stroke-linecap="round" fill="none">
      <path d="M8 8.5 L18.5 4.2" stroke="#ffc425" stroke-width="4.2"/>
      <path d="M4.8 13 L14.8 10.4" stroke="#1172ff" stroke-width="4.2"/>
      <path d="M5.6 19 L12.6 17.2" stroke="#5cb0ff" stroke-width="4.2"/></g></svg>
    <span class="lock"><span class="cc">ClassCade</span><span class="lp">Loop</span></span>
    <span class="util">
      <a class="m-bell" href="messages.html">✉️<span class="dot"></span></a>
      <span class="m-me">${esc(PARENT.name[0])}</span>
    </span></div>`;
}

/* class posts and per-child signals share one reverse-chronological log */
function mergeLog(sig, updates){
  return sig.map(x=>Object.assign({},x))
    .concat(updates.map(u=>Object.assign({},u)))
    .sort((a,b)=>String(b.d).localeCompare(String(a.d)))
    .slice(0, 12);
}
function signalRow(x){
  return `<div class="m-frow">
    <span class="fd">${fmtShort(x.d)}</span>
    <span class="fi" style="background:var(--tint)">${x.sig.emoji}</span>
    <span class="ft"><b style="${x.v<0?'color:var(--watch)':''}">${esc(x.sig.label)}</b><span>${esc(x.detail)}</span></span>
    ${x.coins?`<span class="fc">⊙ +${x.coins}</span>`:''}
  </div>`;
}
function classPost(u){
  return `<div class="m-frow" style="align-items:flex-start">
    <span class="fd">${fmtShort(u.d)}</span>
    <span class="fi" style="background:${u.kind==='system'?'#fff6d9':'var(--school-bg)'}">${u.kind==='system'?'⭐':'📣'}</span>
    <span class="ft">
      <b>${u.kind==='system'?'ClassCade':esc(u.from)} <span style="font-weight:800;color:var(--muted-2);font-size:10px;letter-spacing:.06em">· WHOLE CLASS</span></b>
      <span>${esc(u.body)}</span>
      ${u.photo?'<span class="s-photo">📷 Photo from Ms. Alvarez</span>':''}
    </span>
  </div>`;
}
function fmtShort(s){ const m=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const p=s.split('-'); return m[+p[1]-1]+' '+(+p[2]) }

function renderDesktop(){
  document.body.classList.remove('darktop');
  const tier = LOOP.store.tier();
  if (tier==='family'){ $('#app').innerHTML = topline('Nothing here until a classroom is connected.') + notConnected(); wireTopline(); wireC(); return }

  const all = LOOP.activity(ME, 40);
  const rows = filter==='all' ? all : filter==='up' ? all.filter(x=>x.v>0) : all.filter(x=>x.v<0);
  const cn = LOOP.coins(ME);
  const wk = all.filter(x=>LOOP.thisWeek(x.d));

  $('#app').innerHTML = `
    ${topline(`Everything ${esc(d.poss)} classroom has seen — raw, before Loop interprets it.`)}
    <div class="dash">
      <div class="stack">
        <div class="card mo-1">
          <div class="wl-head" style="margin:0 0 10px">
            <h3 style="font-size:17px">What happened at school</h3>
            <span class="spacer"></span>
            <div style="display:flex;gap:6px">
              ${[['all','Everything'],['up','Went well'],['down','Worth knowing']].map(([k,l])=>
                `<button class="btn sm ${filter===k?'sel':''}" data-f="${k}">${l}</button>`).join('')}
            </div>
          </div>
          <table class="feed">
            ${rows.length ? rows.map(x=>`<tr>
              <td class="dt">${fmt(x.d)}</td>
              <td style="width:30px;font-size:15px">${x.sig.emoji}</td>
              <td class="sg" style="color:${x.v<0?'var(--watch)':'var(--ink)'}">${esc(x.sig.label)}</td>
              <td class="muted">${esc(x.detail)}</td>
              <td class="who">Ms. Alvarez</td>
              <td style="text-align:right">${x.coins?`<span class="coin">⊙ +${x.coins}</span>`:'<span class="tiny muted">—</span>'}</td>
            </tr>`).join('') : '<tr><td class="muted small" style="padding:18px 0">Nothing in this filter.</td></tr>'}
          </table>
          <p class="tiny muted" style="margin-top:13px">
            Captured while Showdown ran normally. <strong>Ms. Alvarez filled out nothing.</strong>
            Loop shows you the raw feed so the interpretation on the other pages is auditable — you can always see what it was built from.
          </p>
        </div>

        <div class="card">
          <div class="mini-head">
            <div class="mini-ico" style="background:var(--school-bg)">🧑‍🏫</div>
            <div><div class="mini-lbl">From Ms. Alvarez</div>
            <h4 style="margin-top:1px">Notes home</h4></div>
          </div>
          ${TEACHER_MESSAGES.filter(m=>m.s===ME).map(m=>`
            <div class="src"><div class="src-key school">${fmt(m.d)}</div>
            <div class="src-body">${esc(m.body)}</div></div>`).join('')
            || '<p class="small muted">Nothing this week.</p>'}
          <p class="tiny muted" style="margin-top:12px">Teacher notes are rare by design. If this list ever fills up, Loop has quietly become a messaging app.</p>
        </div>
      </div>

      <div class="rail">
        <div class="card">
          <div class="lbl" style="font-size:10.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px">The classroom</div>
          <h4>Ms. Alvarez · 3rd Grade</h4>
          <p class="small muted" style="margin-top:5px">${ROSTER.length} students · using ClassCade Showdown</p>
          <div class="hairline" style="margin:14px -18px"></div>
          <div style="display:flex;align-items:center;gap:12px">
            ${bog(LOOP.store.boggie(ME),'md','ring')}
            <div><div class="tiny muted">${esc(d.first)}’s Boggie</div>
            <div style="font-weight:900">${esc(BOGGIES[LOOP.store.boggie(ME)])}</div></div>
          </div>
        </div>
        <div class="card">
          <div class="lbl" style="font-size:10.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px">This week</div>
          <div style="display:flex;align-items:center;gap:16px">
            <div><div style="font-size:27px;font-weight:900;letter-spacing:-.04em">${wk.length}</div>
              <div class="tiny muted">signals</div></div>
            <div><div style="font-size:27px;font-weight:900;letter-spacing:-.04em;color:#7a5a00">${cn.total}</div>
              <div class="tiny muted">coins</div></div>
          </div>
          <p class="tiny muted" style="margin-top:11px">Coins are Showdown's currency. They never feed a Whole Learner read.</p>
        </div>
        ${eventRail()}
      </div>
    </div>`;
  wireTopline();
  $$('[data-f]').forEach(b=>b.onclick=()=>{ filter=b.dataset.f; render() });
}

function eventRail(){
  const e = EVENTS_UPCOMING.find(x=>x.s===ME); if(!e) return '';
  return `<div class="card" style="background:#fffdf4;border-color:rgba(255,196,37,.4)">
    <div class="lbl" style="font-size:10.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#8a6400;margin-bottom:6px">Upcoming</div>
    <h4>${esc(e.kind)}</h4><p class="small muted">${esc(e.when)}</p>
    <a class="link" href="ask.html#conference">Get questions to ask →</a></div>`;
}
function notConnected(){
  return `<div class="card" style="text-align:center;max-width:560px;margin:20px auto">
    ${bog('sharky','xl','ring')}
    <h3 style="margin:14px 0 8px">${esc(d.poss.charAt(0).toUpperCase()+d.poss.slice(1))} classroom isn’t connected.</h3>
    <p class="muted" style="max-width:46ch;margin:0 auto">Loop Family works entirely on what you notice and what ${esc(d.first)} tells you. Connect the classroom and everything ${esc(d.subj)} already does in Showdown starts appearing here — with no extra work for the teacher.</p>
    <button class="btn primary" style="margin-top:16px" id="conn">🔗 Connect ${esc(d.first)}’s classroom</button>
  </div>`;
}
function wireC(){ const c=$('#conn'); if(c) c.onclick=()=>{ LOOP.store.setTier('connected'); location.reload() } }
function fmt(s){ const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const p=s.split('-'); return m[+p[1]-1]+' '+(+p[2]) }

mountApp('school');
render();
</script>
</body></html>
