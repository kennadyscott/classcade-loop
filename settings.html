<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings · ClassCade Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="loop.css?v=115">
</head><body>
<div id="app"></div>
<script src="loop.data.js?v=115"></script>
<script src="loop.engine.js?v=115"></script>
<script src="loop.shell.js?v=115"></script>
<script>
const d = LOOP.child(ME);

function render(){
  if (document.body.classList.contains('sm')) return renderPhone();
  return renderDesktop();
}

function brandRow(){
  return `<div class="m-brand">
    <svg style="width:17px;height:17px" viewBox="0 0 24 24" aria-hidden="true"><g stroke-linecap="round" fill="none">
      <path d="M8 8.5 L18.5 4.2" stroke="#ffc425" stroke-width="4.2"/>
      <path d="M4.8 13 L14.8 10.4" stroke="#1172ff" stroke-width="4.2"/>
      <path d="M5.6 19 L12.6 17.2" stroke="#5cb0ff" stroke-width="4.2"/></g></svg>
    <span class="lock"><span class="cc">ClassCade</span><span class="lp">Loop</span></span>
    <span class="util"><a class="m-bell" href="messages.html">${ico('nav-notifications',20)}</a>
    <span class="m-me">${esc(PARENT.name[0])}</span></span></div>`;
}

function renderPhone(){
  document.body.classList.add('darktop');
  const p = LOOP.store.prefs();
  const tier = LOOP.store.tier();
  const kid = FAMILY.find(f=>f.id===ME) || FAMILY[0];

  $('#app').innerHTML = `
    <div class="m-dark">
      ${brandRow()}
      <div class="m-greetrow">
        <div><div class="m-greet">Settings</div>
        <div class="m-greet-sub">Your plan and your rhythm.</div></div>
        <div class="m-kidpill" id="kidmenu">
          <div class="av g1" style="width:28px;height:28px;border-radius:9px;font-size:12px">${esc(kid.label[0])}</div>
          <div style="min-width:0"><div class="nm">${esc(kid.label)}</div><div class="mt">${esc(kid.grade)}</div></div>
          <span class="cv">⌄</span>
        </div>
      </div>
    </div>

    <div class="m-light">
      <div class="m-secrow">Plan</div>
      <div class="s-card">
        <div style="display:flex;align-items:center;gap:13px">
          <div class="dim-ico lg" style="background:${tier==='connected'?'var(--school-bg)':'var(--home-bg)'};box-shadow:none">
            ${tier==='connected'?'🔗':'🏠'}</div>
          <div style="flex:1;min-width:0">
            <h4 style="font-size:16px;letter-spacing:-.03em">Loop ${esc(TIER_COPY[tier].name)}</h4>
            <p class="small muted" style="margin-top:2px">${esc(TIER_COPY[tier].price)}</p>
          </div>
        </div>
        <p class="small muted" style="margin-top:11px">${esc(TIER_COPY[tier].blurb)}</p>
        <button class="btn ${tier==='family'?'primary':'ghost'} sm block" style="margin-top:12px" id="flip">
          ${tier==='family'?'🔗 Connect a classroom':'Switch to Family'}</button>
      </div>

      <div class="m-secrow">The weekly ritual</div>
      <div class="s-card">
        ${row('Weekly read','One noticing, one thing to try, one question to ask.',
              `<select class="pick" data-pref="weeklyDay">${['Sunday','Saturday','Monday','Friday'].map(x=>`<option ${p.weeklyDay===x?'selected':''}>${x}</option>`).join('')}</select>`)}
        ${row('Daily 5-minute moment','One small idea, six days a week.',
              sw('dailyMoment',p.dailyMoment))}
        ${row('Never notify me about a single bad day','Loop waits for a pattern — 3+ signals, 2+ pointing the same way.',
              sw('quietUntilPattern',p.quietUntilPattern))}
        ${row('When Ms. Alvarez acknowledges something','A quiet confirmation. No badge, no count.',
              sw('teacherAlerts',p.teacherAlerts))}
      </div>

      <div class="m-secrow">Sharing</div>
      <div class="s-card">
        ${row('Send my observations to her teacher','One tap plus up to '+NOTE_CAP+' characters, always tagged to an area.',
              sw('shareWithSchool',p.shareWithSchool))}
        ${row('Language','Insights, prompts and the Ask library.',
              `<select class="pick" data-pref="language">${['English','Español','Tiếng Việt','中文','العربية'].map(x=>`<option ${p.language===x?'selected':''}>${x}</option>`).join('')}</select>`)}
      </div>

      <div class="m-secrow">Framework</div>
      <div class="s-card">
        <p class="small muted" style="margin-bottom:11px">${tier==='connected'
          ? 'Set by '+esc(d.poss)+' school. Loop shows their words for the six areas.'
          : 'No school connected, so Loop uses its own names.'}</p>
        <div class="st-row" style="border-top:0;padding-top:0">
          <div class="st-tx"><h5>${esc(LOOP.framework().name)}</h5>
            <p>${esc(LOOP.framework().source)} · ${DIMENSIONS.map(x=>esc(x.name)).join(' · ')}</p></div>
        </div>
        <select class="pick" id="fwPick" style="width:100%;margin-top:4px">
          ${Object.keys(FRAMEWORKS).map(k=>`<option value="${k}" ${LOOP.store.framework()===k?'selected':''}>${esc(FRAMEWORKS[k].name)}</option>`).join('')}
        </select>
        <p class="tiny muted" style="margin-top:9px">The six areas are structural — the signals and the
          maths don't change. Only the words do, so a school running its own habits framework sees its own
          language.</p>
      </div>

      <div class="m-secrow">Child privacy</div>
      <div class="s-card lockcard">
        <p class="small muted" style="margin-bottom:4px">These aren't preferences — they're why a child keeps telling
          the truth in the app. Shown here so you can see them, not change them.</p>
        ${lockRow('Loop collects nothing from '+esc(d.first)+' directly',
          'There is no child login and no child-facing screen. Everything comes from her classroom or from you.')}
        ${lockRow(esc(d.first)+' never sees a level, trend, or score',
          'Not hidden behind a toggle — never computed for a child at all.')}
      </div>

      <div class="m-secrow">Your data</div>
      <div class="s-card">
        ${row('Export everything','Every signal and observation, as JSON.','<button class="btn sm ghost" id="exp">Download</button>')}
        ${row('Reset this prototype','Clears everything. Seeded data returns.','<button class="btn sm" id="rst">Reset</button>')}
      </div>

      <details class="g-fold" style="margin-top:12px">
        <summary><span class="fi" style="background:var(--tint)">💬</span>Why Loop works this way</summary>
        <div class="fb">
          <p class="small" style="margin-bottom:9px">${esc(LANGUAGE.rule)}</p>
          <div>${LANGUAGE.use.map(w=>`<span class="chip good" style="margin:0 5px 5px 0">${esc(w)}</span>`).join('')}</div>
          <div style="margin-top:5px">${LANGUAGE.never.map(w=>`<span class="chip plain" style="margin:0 5px 5px 0;text-decoration:line-through;opacity:.55">${esc(w)}</span>`).join('')}</div>
          <p class="tiny muted" style="margin-top:11px">Prototype — no account, no server, nothing leaves this browser.</p>
        </div>
      </details>
    </div>`;
  wireTopline(); wire();
}

function row(title, sub, control){
  return `<div class="st-row"><div class="st-tx"><h5>${title}</h5><p>${sub}</p></div>${control}</div>`;
}
function sw(key, on){ return `<button class="sw ${on?'on':''}" data-toggle="${key}" role="switch" aria-checked="${!!on}" aria-label="${key}"></button>` }
/* A rule that cannot be changed must not look like a switch. */
function lockRow(title, sub){
  return `<div class="st-row lock"><span class="lk">🔒</span>
    <div class="st-tx"><h5>${title}</h5><p>${sub}</p></div>
    <span class="lk-tag">Always on</span></div>`;
}

function renderDesktop(){
  document.body.classList.remove('darktop');
  const p = LOOP.store.prefs();
  const tier = LOOP.store.tier();
  $('#app').innerHTML = `
    ${topline('Your plan, your rhythm, and the rules Loop will not let you turn off.', 'Settings')}
    <div class="dash">
      <div class="stack">

        <div class="card">
          <div class="sec-label">Plan</div>
          <div style="display:flex;align-items:center;gap:15px;flex-wrap:wrap">
            <div class="dim-ico lg" style="background:${tier==='connected'?'var(--school-bg)':'var(--home-bg)'};box-shadow:none">
              ${tier==='connected'?'🔗':'🏠'}</div>
            <div style="flex:1;min-width:180px">
              <h3>Loop ${esc(TIER_COPY[tier].name)}</h3>
              <p class="small muted" style="margin-top:3px">${esc(TIER_COPY[tier].price)} · ${esc(TIER_COPY[tier].blurb)}</p>
            </div>
            <button class="btn ${tier==='family'?'primary':'ghost'} sm" id="flip">
              ${tier==='family'?'🔗 Connect a classroom':'Switch to Family'}</button>
          </div>
          <p class="tiny muted" style="margin-top:12px">Priced per family, not per child. Connecting a classroom never changes the price — the school's ClassCade license covers it.</p>
        </div>

        <div class="card"><details class="fold-sec" ${wideScreen()?"open":""}><summary class="show-sm">The weekly ritual</summary>
          <div class="sec-label hide-sm">The weekly ritual</div>
          <div class="setrow">
            <div class="txt"><h5>Weekly read</h5>
              <p>One noticing, one thing to try, one question to ask. The anchor of the whole product.</p></div>
            <select class="pick" data-pref="weeklyDay">
              ${['Sunday','Saturday','Monday','Friday'].map(x=>`<option ${p.weeklyDay===x?'selected':''}>${x}</option>`).join('')}
            </select>
            <select class="pick" data-pref="weeklyTime">
              ${['7:00 AM','8:00 AM','9:00 AM','7:00 PM'].map(x=>`<option ${p.weeklyTime===x?'selected':''}>${x}</option>`).join('')}
            </select>
          </div>
          <div class="setrow">
            <div class="txt"><h5>Daily 5-minute moment</h5>
              <p>One small idea, six days a week. Turn it off and the weekly read still works.</p></div>
            <select class="pick" data-pref="dailyTime" ${p.dailyMoment?'':'disabled'}>
              ${['3:30 PM','4:30 PM','5:30 PM','7:30 PM'].map(x=>`<option ${p.dailyTime===x?'selected':''}>${x}</option>`).join('')}
            </select>
            <button class="sw ${p.dailyMoment?'on':''}" data-toggle="dailyMoment"></button>
          </div>
          <div class="setrow">
            <div class="txt"><h5>Never notify me about a single bad day</h5>
              <p>Loop waits for a pattern — 3+ signals, 2+ pointing the same way — before it tells you anything. Turning this off would let one rough Tuesday become a notification.</p></div>
            <button class="sw ${p.quietUntilPattern?'on':''}" data-toggle="quietUntilPattern"></button>
          </div>
          <div class="setrow">
            <div class="txt"><h5>When Ms. Alvarez acknowledges something</h5>
              <p>A quiet confirmation that she saw what you sent. No badge, no count.</p></div>
            <button class="sw ${p.teacherAlerts?'on':''}" data-toggle="teacherAlerts"></button>
          </div>
        </details></div>

        <div class="card" style="border-color:rgba(124,92,252,.35)">
          <div class="sec-label hide-sm" style="color:var(--child)">Child privacy · not configurable</div>
          <h4 style="margin-bottom:5px">Two rules Loop enforces for you.</h4>
          <p class="small muted" style="margin-bottom:6px">These aren't preferences. They're the reason a child will keep telling the truth in the app.</p>
          <div class="setrow">
            <div class="txt"><h5>🔒 Loop collects nothing from ${esc(d.first)} directly</h5>
              <p>There is no child login and no child-facing screen. Everything Loop knows comes from ${esc(d.poss)} classroom or from you — including anything ${esc(d.subj)} said, which you relay. There's no setting because there's no data path.</p></div>
            <button class="sw locked on" title="Enforced — cannot be changed" disabled></button>
          </div>
          <div class="setrow">
            <div class="txt"><h5>🔒 ${esc(d.first)} never sees a level, trend, or score</h5>
              <p>Not hidden behind a toggle — never computed for a child at all. If a child-facing surface is ever built, this is the rule it gets built under.</p></div>
            <button class="sw locked on" title="Enforced — cannot be changed" disabled></button>
          </div>
        </div>

        <div class="card"><details class="fold-sec" ${wideScreen()?"open":""}><summary class="show-sm">Sharing</summary>
          <div class="sec-label hide-sm">Sharing</div>
          <div class="setrow">
            <div class="txt"><h5>Send my observations to ${esc(d.poss)} teacher</h5>
              <p>Only what you explicitly send — one tap plus up to ${NOTE_CAP} characters, always tagged to an area. Turning this off makes Loop read-only from school.</p></div>
            <button class="sw ${p.shareWithSchool?'on':''}" data-toggle="shareWithSchool"></button>
          </div>
          <div class="setrow">
            <div class="txt"><h5>Language</h5><p>Insights, prompts and the Ask library.</p></div>
            <select class="pick" data-pref="language">
              ${['English','Español','Tiếng Việt','中文','العربية'].map(x=>`<option ${p.language===x?'selected':''}>${x}</option>`).join('')}
            </select>
          </div>
        </details></div>

        <div class="card"><details class="fold-sec" ${wideScreen()?"open":""}><summary class="show-sm">Your data</summary>
          <div class="sec-label hide-sm">Your data</div>
          <div class="setrow">
            <div class="txt"><h5>Export everything</h5>
              <p>Every signal, every observation, every insight — as JSON. No dark patterns on the way out.</p></div>
            <button class="btn sm ghost" id="exp">Download</button>
          </div>
          <div class="setrow">
            <div class="txt"><h5>Reset this prototype</h5>
              <p>Clears responses, observations, Boggie picks and preferences. Seeded data returns.</p></div>
            <button class="btn sm" id="rst">Reset</button>
          </div>
        </details></div>
      </div>

      <div class="rail">
        <div class="card" style="text-align:center">
          ${bog(LOOP.store.boggie(ME),'xl','ring')}
          <h4 style="margin-top:13px">${esc(BOGGIES[LOOP.store.boggie(ME)])}</h4>
          <p class="small muted" style="margin-top:4px">${esc(d.first)}’s Boggie from Showdown. Change it on My Kids.</p>
          <a class="link" href="kids.html">My Kids →</a>
        </div>
        <div class="card tinted">
          <div class="lbl" style="font-size:10.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:7px">Account</div>
          <p class="small"><strong>${esc(PARENT.name)}</strong><br>${FAMILY.length} children · ${esc(TIER_COPY[tier].name)} plan</p>
          <p class="tiny muted" style="margin-top:10px">Prototype — no account, no server, nothing leaves this browser.</p>
        </div>
      </div>
    </div>`;
  wireTopline(); wire();
}

function wire(){
  $$('[data-toggle]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.toggle, p=LOOP.store.prefs();
    LOOP.store.setPref(k, !p[k]);
    if (k==='quietUntilPattern' && p[k]) toast('Careful — that’s the guardrail that stops one bad day becoming an alert.');
    render();
  });
  $$('[data-pref]').forEach(s=>s.onchange=()=>{ LOOP.store.setPref(s.dataset.pref, s.value); toast('Saved.') });
  const fw=$('#fwPick'); if(fw) fw.onchange=()=>{ LOOP.store.setFramework(fw.value);
    toast('Now showing '+FRAMEWORKS[fw.value].name+'.'); setTimeout(()=>location.reload(),700) };
  $('#flip').onclick = ()=>{ LOOP.store.setTier(LOOP.store.tier()==='family'?'connected':'family'); location.reload() };
  $('#exp').onclick = ()=>{
    const data = { child:ME, tier:LOOP.store.tier(), read:LOOP.read(ME), events:LOOP.events(ME),
                   responses:LOOP.store.responses(), prefs:LOOP.store.prefs() };
    const b = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = 'loop-export.json'; a.click();
    toast('Exported.');
  };
  $('#rst').onclick = ()=>{ LOOP.store.reset(); toast('Prototype reset.'); setTimeout(()=>location.reload(),700) };
}

mountApp('set');
render();
</script>
</body></html>
