<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>At Home · ClassCade Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="loop.css?v=131">
</head><body>
<div id="app"></div>
<script src="loop.data.js?v=131"></script>
<script src="loop.engine.js?v=131"></script>
<script src="loop.shell.js?v=131"></script>
<script>
const d = LOOP.child(ME);
let editing = false, building = false;

function render(){
  if (document.body.classList.contains('sm')) return renderPhone();
  return renderDesktop();
}

function brandRow(){
  return `<div class="m-brand">
    <svg style="width:17px;height:17px" viewBox="0 0 24 24" aria-hidden="true"><g stroke-linecap="round" fill="none">
      <path d="M8 8.5 L18.5 4.2" stroke="#ffc425" stroke-width="4.2"/>
      <path d="M4.8 13 L14.8 10.4" stroke="#1172ff" stroke-width="4.2"/>
      <path d="M5.6 19 L12.6 17.2" stroke="#5cb0ff" stroke-width="4.2"/></g></svg>
    <span class="lock"><span class="cc">ClassCade</span><span class="lp">Loop</span></span>
    <span class="util"><a class="m-bell" href="messages.html">${ico('nav-notifications',20)}</a>
    <span class="m-me">${esc(PARENT.name[0])}</span></span></div>`;
}

function board(){ return LOOP.choreBoard(ME) }

/* Practice: assign it, then release the coins once it has actually happened.
   Two steps so the payout tracks practice rather than a tap. */
function practiceSection(){
  const today = LOOP.practiceToday(ME);
  const pStreak = LOOP.practiceStreak(ME);
  const mins = LOOP.practiceMinutesThisWeek(ME);
  const assignedIds = today.map(x=>x.p);
  return `
    <div class="m-secrow">Practice${pStreak>=PRACTICE_STREAK_FOR_SIGNAL
      ? ` <span class="ch-streak">${pStreak} days · ${mins} min this week</span>`
      : (mins?` <span class="swipe">${mins} min this week</span>`:'')}</div>

    ${today.length ? today.map(x=>`
      <div class="pr-row ${x.done?'done':''}">
        <span class="e">${x.meta.emoji}</span>
        <span class="tx">
          <span class="lb">${esc(x.meta.label)}</span>
          <span class="mt">${x.m} minutes${x.done?' · released':' · assigned today'}</span>
        </span>
        <span class="cn ${x.done?'paid':''}">⊙ ${x.coins}</span>
        <button class="btn sm ${x.done?'':'primary'}" data-release="${x.p}">
          ${x.done?'Undo':'Release coins'}</button>
      </div>`).join('')
      : '<p class="small muted" style="margin:0 3px 10px">Nothing assigned today.</p>'}

    <div class="pr-assign">
      <div class="pa-h">Quick assign</div>
      ${PRACTICE.map(p=>`
        <div class="pa-row ${assignedIds.includes(p.id)?'on':''}">
          <span class="e">${p.emoji}</span>
          <span class="tx"><span class="lb">${esc(p.label)}</span>
            <span class="mt">${esc(p.note)}</span></span>
          <span class="mins">
            ${p.mins.map(m=>`<button class="mbtn" data-assign2="${p.id}" data-mins="${m}"
              ${assignedIds.includes(p.id)?'disabled':''}>${m}m</button>`).join('')}
          </span>
        </div>`).join('')}
      ${!LOOP.deep()?'':`<p class="ch-note">Coins only move when you release them, so they follow practice
        that actually happened. A session of any of these is worth about the same — if reading paid less
        than fluency, ${esc(d.first)} would simply stop reading.</p>`}
    </div>`;
}

function choreRow(c){
  return `<button class="ch-row ${c.done?'done':''}" data-chore="${c.id}"
    aria-pressed="${c.done}" aria-label="${esc(c.label)}${c.done?', done':''}">
    <span class="tick">✓</span>
    <span class="e">${c.emoji}</span>
    <span class="tx"><span class="lb">${esc(c.label)}</span>
      ${c.streak>=STREAK_FOR_SIGNAL
          ? `<span class="mt"><span class="ch-streak">${c.streak} days this week</span></span>`
          : (c.streak>0 ? `<span class="mt">${c.streak} day${c.streak===1?'':'s'} this week</span>` : '')}</span>
    ${c.coins?`<span class="cn">⊙ ${c.coins}</span>`:''}
  </button>`;
}

function rewardGrid(bal){
  return `<div class="rw-grid">
    ${HOME_REWARDS.map(r=>`<button class="rw" data-reward="${r.id}" ${bal<r.coins?'disabled':''}>
      <span class="e">${r.emoji}</span><span class="tx">${esc(r.label)}</span>
      <span class="px">⊙ ${r.coins}</span></button>`).join('')}
  </div>`;
}

/* Build your own At Home page: which sections appear, what's on each list,
   and room to add the things this family actually does. */
function builder(){
  const P = LOOP.store.homePrefs();
  const mine = LOOP.store.chores(ME);
  const C = LOOP.store.custom();
  const SEC = [
    ['practice','Practice','Assign reading, fluency and drills, then release the coins'],
    ['streak','Daily streak','A bonus for checking in day after day'],
    ['contributions','Contributions','Everyday jobs that earn nothing, on purpose'],
    ['extras','Extras','Above and beyond, and worth coins'],
    ['rewards','Spend at home','What coins buy in your house'],
  ];
  return `
  <div class="bld">
    <div class="bld-h">
      <div><h4>Build your At Home page</h4>
        <p>Turn off what you don't use, and add the things your family actually does.</p></div>
      <button class="btn primary sm" id="doneBuild">Done</button>
    </div>

    <div class="bld-sec">Sections on this page</div>
    ${SEC.map(([k,lb,note])=>`
      <div class="st-row" style="border-top:1px solid var(--line-soft)">
        <div class="st-tx"><h5>${lb}</h5><p>${note}</p></div>
        <button class="sw ${P[k]?'on':''}" data-sec="${k}" role="switch" aria-checked="${!!P[k]}"
          aria-label="${lb}"></button>
      </div>`).join('')}

    <div class="bld-sec">What's on ${esc(d.first)}'s chore list</div>
    ${['contribution','extra'].map(k=>`
      <div class="bld-sub">${CHORE_KINDS[k].label}s — ${esc(CHORE_KINDS[k].note)}</div>
      ${CHORES.filter(c=>c.kind===k).map(c=>`
        <button class="ch-row ${mine.includes(c.id)?'done':''}" data-assign="${c.id}">
          <span class="tick">✓</span><span class="e">${c.emoji}</span>
          <span class="tx"><span class="lb">${esc(c.label)}</span>
            ${c.custom?'<span class="mt">Added by you</span>':''}</span>
          ${c.coins?`<span class="cn">⊙ ${c.coins}</span>`:''}
          ${c.custom?`<span class="bx" data-rmchore="${c.id}">Delete</span>`:''}
        </button>`).join('')}`).join('')}

    <div class="bld-add">
      <div class="bld-sub">Add your own job</div>
      <input id="ncLabel" class="kc-in" style="text-transform:none;letter-spacing:0;font-weight:700"
        placeholder="e.g. Walk the dog after dinner" maxlength="46">
      <div class="bld-arow">
        <select class="pick" id="ncKind">
          <option value="contribution">Contribution — no coins</option>
          <option value="extra">Extra — earns coins</option>
        </select>
        <select class="pick" id="ncCoins">
          ${[10,15,20,25,30].map(n=>`<option value="${n}">⊙ ${n}</option>`).join('')}
        </select>
        <button class="btn sm primary" id="ncAdd">Add</button>
      </div>
    </div>

    <div class="bld-sec">What coins buy here</div>
    ${HOME_REWARDS.map(r=>`
      <div class="rw" style="margin-bottom:8px">
        <span class="e">${r.emoji}</span><span class="tx">${esc(r.label)}</span>
        <span class="px">⊙ ${r.coins}</span>
        ${r.custom?`<span class="bx" data-rmreward="${r.id}">Delete</span>`:''}
      </div>`).join('')}
    <div class="bld-add">
      <div class="bld-sub">Add your own reward</div>
      <input id="nrLabel" class="kc-in" style="text-transform:none;letter-spacing:0;font-weight:700"
        placeholder="e.g. Friday movie pick" maxlength="46">
      <div class="bld-arow">
        <select class="pick" id="nrCoins">
          ${[30,50,80,120,200].map(n=>`<option value="${n}">⊙ ${n}</option>`).join('')}
        </select>
        <button class="btn sm primary" id="nrAdd">Add</button>
      </div>
    </div>

    <div class="bld-sec">Practice you can assign</div>
    ${PRACTICE.map(p=>`
      <div class="pa-row">
        <span class="e">${p.emoji}</span>
        <span class="tx"><span class="lb">${esc(p.label)}</span>
          <span class="mt">${p.mins.join(' / ')} min · ⊙ ${p.perMin}/min</span></span>
        ${p.custom?`<span class="bx" data-rmpractice="${p.id}">Delete</span>`:''}
      </div>`).join('')}
    <div class="bld-add">
      <div class="bld-sub">Add your own practice</div>
      <input id="npLabel" class="kc-in" style="text-transform:none;letter-spacing:0;font-weight:700"
        placeholder="e.g. Piano practice" maxlength="46">
      <div class="bld-arow">
        <select class="pick" id="npMins">
          ${[[ '10,20','10 / 20 min'],['15,30','15 / 30 min'],['5,10','5 / 10 min']].map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}
        </select>
        <button class="btn sm primary" id="npAdd">Add</button>
      </div>
    </div>

    <button class="btn primary block" style="margin-top:14px" id="doneBuild2">Done</button>
  </div>`;
}

function editList(){
  const mine = LOOP.store.chores(ME);
  return `<div class="s-card">
    <p class="small muted" style="margin-bottom:11px">Pick what ${esc(d.first)} is responsible for.
      Contributions never earn coins; extras do.</p>
    ${['contribution','extra'].map(k=>`
      <div class="sec-label" style="margin-top:10px">${CHORE_KINDS[k].label}s <span style="font-weight:700;text-transform:none;letter-spacing:0">— ${esc(CHORE_KINDS[k].note)}</span></div>
      ${CHORES.filter(c=>c.kind===k).map(c=>`
        <button class="ch-row ${mine.includes(c.id)?'done':''}" data-assign="${c.id}">
          <span class="tick">✓</span><span class="e">${c.emoji}</span>
          <span class="tx"><span class="lb">${esc(c.label)}</span></span>
          ${c.coins?`<span class="cn">⊙ ${c.coins}</span>`:''}
        </button>`).join('')}`).join('')}
    <button class="btn primary block" style="margin-top:12px" id="doneEdit">Done</button>
  </div>`;
}

function body(){
  const b = board();
  const hc = LOOP.homeCoins(ME);
  const sig = LOOP.choreSignals(ME);
  const P = LOOP.store.homePrefs();
  if (building) return builder();
  if (editing) return editList();
  return `
    ${P.practice?practiceSection():''}

    ${!P.streak?'':(()=>{const cb=LOOP.checkinBonus(ME);return `
    <div class="ch-streakbar ${cb.streak?'on':''}">
      <span class="sb-flame">${cb.streak?'🔥':'○'}</span>
      <span class="sb-tx">
        <b>${cb.streak?cb.streak+' day'+(cb.streak===1?'':'s')+' in a row':'No streak yet'}</b>
        <span>${cb.streak
          ? (LOOP.deep()
              ? `+${cb.base} for showing up${cb.bonus?` · +${cb.bonus} streak bonus`:''}${cb.perfect?` · +${CHECKIN.perfectWeek} perfect week`:''}`
              : 'Keep it going.')
          : 'Check something off today to start one.'}</span></span>
      ${cb.streak?`<span class="sb-amt">+${cb.today}</span>`:''}
    </div>`})()}

    <div class="s-card">
      <div class="ch-bal">
        <span class="coin">${ico('coins',30)}</span>
        <div style="flex:1;min-width:0">
          <div class="amt">${hc.balance} coins</div>
          <div class="sub">${b.doneToday} of ${b.total} done today${b.earnedToday?` · +${b.earnedToday} earned`:''}</div>
        </div>
        <button class="btn sm ghost" id="edit">Edit list</button>
      </div>
      ${!LOOP.deep()?'':`<p class="ch-note">The streak rewards showing up, and it's capped at
        +${CHECKIN.maxStreakBonus} so it can never outweigh real effort. Same currency as Showdown — ${esc(d.first)} can spend these in the game, or on
        something at home. Coins are a game, not a read: they never move a ${esc(LOOP.framework().name)} area.</p>`}
    </div>

    ${!P.contributions?'':`
    <div class="m-secrow">Contributions <span class="swipe">no coins</span></div>
    ${b.contributions.length ? b.contributions.map(choreRow).join('')
      : '<p class="small muted" style="margin:0 3px 10px">None on the list yet.</p>'}`}

    ${!P.extras?'':`
    <div class="m-secrow">Extras <span class="swipe">earn coins</span></div>
    ${b.extras.length ? b.extras.map(choreRow).join('')
      : '<p class="small muted" style="margin:0 3px 10px">None on the list yet.</p>'}`}

    ${(sig.length && LOOP.deep())?`
    <div class="m-secrow">What this is telling Loop</div>
    <div class="s-card" style="background:var(--home-bg);border-color:rgba(14,147,132,.22)">
      ${sig.map(x=>`<div class="src" style="padding:9px 0">
        <div class="src-key home">${esc(x.dim.name)}</div>
        <div class="src-body small">Kept up <b>${esc(x.chore.label.toLowerCase())}</b> ${x.days} days this week —
          that's a pattern, so it counts as one signal.</div></div>`).join('')}
      <p class="ch-note">A single tick never counts. Only a week's worth does.</p>
    </div>`:''}

    ${!P.rewards?'':`
    <div class="m-secrow">Spend at home</div>
    ${rewardGrid(hc.balance)}`}
    <p class="ch-note">You set these. Showdown's own store is always the other option — that's the point
      of one currency.</p>`;
}

function renderPhone(){
  document.body.classList.add('darktop');
  const kid = FAMILY.find(f=>f.id===ME) || FAMILY[0];
  $('#app').innerHTML = `
    <div class="m-dark">
      ${brandRow()}
      <div class="m-greetrow">
        <div><div class="m-greet">At Home
          <button class="hdr-gear" id="gear" aria-label="Build this page">⚙</button></div>
        <div class="m-greet-sub">${esc(d.first)}'s chores and coins.</div></div>
        <div class="m-kidpill" id="kidmenu">
          <div class="av g1" style="width:28px;height:28px;border-radius:9px;font-size:12px">${esc(kid.label[0])}</div>
          <div style="min-width:0"><div class="nm">${esc(kid.label)}</div><div class="mt">${esc(kid.grade)}</div></div>
          <span class="cv">⌄</span>
        </div>
      </div>
    </div>
    <div class="m-light">${body()}</div>`;
  wireTopline(); wire();
}

function renderDesktop(){
  document.body.classList.remove('darktop');
  const hc = LOOP.homeCoins(ME);
  $('#app').innerHTML = `
    ${topline(esc(d.first)+"'s chores, and what they earn.", 'At Home')}
    <div class="dash">
      <div class="stack">${body()}</div>
      <div class="rail">
        <div class="card">
          <div class="sec-label">How this works</div>
          <p class="small"><b>Contributions</b> are what being in a family costs. They earn nothing —
            paying for them teaches a child that unpaid help is optional.</p>
          <p class="small" style="margin-top:8px"><b>Extras</b> are genuinely above and beyond, and optional.
            Those earn coins.</p>
        </div>
        <div class="card tinted">
          <div class="sec-label">Coins vs the read</div>
          <p class="small muted">Coins are Showdown's currency. They never feed a ${esc(LOOP.framework().name)} area — not from
            school, and not from here. What does feed a read is a <b>pattern</b>: a contribution kept up
            ${STREAK_FOR_SIGNAL}+ days in a week becomes one home signal.</p>
        </div>
        <div class="card">
          <div class="sec-label">Balance</div>
          <div class="ch-bal"><span class="coin">${ico('coins',28)}</span>
            <div><div class="amt">${hc.balance}</div>
            <div class="sub">${hc.earned} earned · ${hc.spent} spent</div></div></div>
        </div>
      </div>
    </div>`;
  wireTopline(); wire();
}

function wire(){
  $$('[data-chore]').forEach(b=>b.onclick=()=>{
    const on = LOOP.store.markChore(ME, b.dataset.chore);
    const c = CHORES.find(x=>x.id===b.dataset.chore);
    render();
    if (on && c.coins) toast('+'+c.coins+' coins for '+c.label.toLowerCase());
    else if (on) toast('Done — contributions don\'t earn coins, on purpose.');
  });
  $$('[data-assign]').forEach(b=>b.onclick=()=>{ LOOP.store.toggleChore(ME, b.dataset.assign); render() });
  $$('[data-reward]').forEach(b=>b.onclick=()=>{
    const r = HOME_REWARDS.find(x=>x.id===b.dataset.reward);
    LOOP.store.spend(ME, r.id); render();
    toast('Spent '+r.coins+' coins on: '+r.label.toLowerCase());
  });
  $$('[data-assign2]').forEach(b=>b.onclick=()=>{
    const p = PRACTICE.find(x=>x.id===b.dataset.assign2);
    LOOP.store.assignPractice(ME, b.dataset.assign2, +b.dataset.mins);
    render(); toast('Assigned '+b.dataset.mins+' minutes of '+p.label.toLowerCase()+'.');
  });
  $$('[data-release]').forEach(b=>b.onclick=()=>{
    const e2 = LOOP.store.releasePractice(ME, b.dataset.release);
    const p = PRACTICE.find(x=>x.id===b.dataset.release);
    render();
    if (e2 && e2.done) toastUndo('+'+(p.perMin*e2.m)+' coins released',
      ()=>{ LOOP.store.releasePractice(ME, b.dataset.release); render() });
  });
  const gr=$('#gear'); if(gr) gr.onclick=()=>{ building=true; render(); window.scrollTo(0,0) };
  ['doneBuild','doneBuild2'].forEach(id=>{ const b=$('#'+id); if(b) b.onclick=()=>{ building=false; render(); window.scrollTo(0,0) } });
  $$('[data-sec]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.sec; LOOP.store.setHomePref(k, !LOOP.store.homePrefs()[k]); render();
  });
  const nc=$('#ncAdd'); if(nc) nc.onclick=()=>{
    const v=($('#ncLabel')||{}).value||''; if(v.trim().length<3){ toast('Give it a name.'); return }
    const kind=$('#ncKind').value; const coins=kind==='extra'?+$('#ncCoins').value:0;
    const c=LOOP.store.addCustom('chores',{label:v.trim(),kind:kind,coins:coins});
    LOOP.store.setChores(ME, LOOP.store.chores(ME).concat(c.id));
    render(); toast('Added: '+c.label);
  };
  const nr=$('#nrAdd'); if(nr) nr.onclick=()=>{
    const v=($('#nrLabel')||{}).value||''; if(v.trim().length<3){ toast('Give it a name.'); return }
    LOOP.store.addCustom('rewards',{label:v.trim(),coins:+$('#nrCoins').value});
    render(); toast('Added to what coins buy.');
  };
  const np=$('#npAdd'); if(np) np.onclick=()=>{
    const v=($('#npLabel')||{}).value||''; if(v.trim().length<3){ toast('Give it a name.'); return }
    LOOP.store.addCustom('practice',{label:v.trim(),mins:$('#npMins').value.split(',').map(Number)});
    render(); toast('You can assign that now.');
  };
  $$('[data-rmchore]').forEach(b=>b.onclick=e2=>{ e2.stopPropagation();
    LOOP.store.removeCustom('chores', b.dataset.rmchore); render(); toast('Removed.') });
  $$('[data-rmreward]').forEach(b=>b.onclick=()=>{ LOOP.store.removeCustom('rewards', b.dataset.rmreward); render(); toast('Removed.') });
  $$('[data-rmpractice]').forEach(b=>b.onclick=()=>{ LOOP.store.removeCustom('practice', b.dataset.rmpractice); render(); toast('Removed.') });
  const e=$('#edit'); if(e) e.onclick=()=>{ building=true; render(); window.scrollTo(0,0) };
  const de=$('#doneEdit'); if(de) de.onclick=()=>{ editing=false; render(); window.scrollTo(0,0) };
}

mountApp('chores');
render();
</script>
</body></html>
