<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home · ClassCade Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="loop.css?v=99">
</head><body>
<div id="app"></div>

<script src="loop.data.js?v=99"></script>
<script src="loop.engine.js?v=99"></script>
<script src="loop.shell.js?v=99"></script>
<script>
const d = LOOP.child(ME);
let pending = null;        /* an observation awaiting confirmation */
let justLogged = false;    /* stage the payoff after one is added */
/* folds start open on a wide screen and closed on a phone */
const wide = () => window.matchMedia('(min-width:901px)').matches
                 && !document.body.classList.contains('appview');

function render(){
  if (document.body.classList.contains('sm')) return renderPhone();
  return renderDesktop();
}

/* The week has a date, a new/seen state, and a way to be finished —
   otherwise a parent opening on Wednesday can't tell what changed. */
function weekBar(){
  const id = 'digest|'+WEEK_START;
  const fresh = LOOP.store.isNew(id);
  const R = LOOP.store.ritualSteps();
  const done = R.steps.filter(s=>s.done).length;
  return `
  <details class="m-week-bar ${fresh?'fresh':''} ${R.complete?'complete':''}">
    <summary>
      ${fresh?'<b class="wb-new">New</b>':''}
      <span class="wb-lb">${R.complete?'Week done':'This week'}</span>
      <span class="wb-dt">${fmtLong(WEEK_START)}–${fmtLong(TODAY)}</span>
      <span class="wb-prog">${done}/3</span>
    </summary>
    <div class="wb-body">
      ${R.steps.map(st=>`<span class="wb-step ${st.done?'done':''}">${st.done?'✓':'○'} ${esc(st.label)}</span>`).join('')}
      ${R.complete ? `<div class="wb-done">🌱 That's the week. Nothing else to do — see you Sunday.</div>` : ''}
    </div>
  </details>`;
}

/* The confirm step: one tap picks it, a second commits it, and there is
   room for a line of context. Logging writes a dated entry a teacher may
   see, so it should not be a single irreversible tap. */
function confirmPanel(){
  const o = HOME_OBS.find(x=>x.id===pending);
  const phrase = (o.phrase||'').replace(/\{subj\}/g,d.subj).replace(/\{poss\}/g,d.poss);
  return `
  <div class="m-confirm">
    <div class="ch"><span class="e">${o.emoji}</span>
      <span><b>${esc(o.label)}</b><span class="pv">Will read: “${esc(d.first)} ${esc(phrase)}”</span></span></div>
    <textarea id="obsNote" class="note" maxlength="${NOTE_CAP}" placeholder="Add a line of context (optional)"></textarea>
    <div class="cw"><span id="obsCount">0</span>/${NOTE_CAP} · dated today, ${fmtLong(TODAY)}</div>
    <div class="ca">
      <button class="btn primary sm" id="obsSave">Add to ${esc(d.first)}'s day</button>
      <button class="btn sm" id="obsCancel">Cancel</button>
    </div>
  </div>`;
}
function loggedList(){
  const mine = LOOP.store.homeObs().filter(e=>e.s===ME && e.user).slice(-3).reverse();
  if (!mine.length) return '';
  return `<div class="m-logged">
    <div class="ll">You logged today</div>
    ${mine.map(e=>{const o=HOME_OBS.find(x=>x.id===e.sig)||{emoji:'🏠',label:'Noticed'};
      return `<div class="lr"><span class="e">${o.emoji}</span>
        <span class="t"><b>${esc(o.label)}</b>${e.note?`<span>“${esc(e.note)}”</span>`:''}</span>
        <button class="lx" data-del="${esc(e.id||'')}" aria-label="Remove">Remove</button></div>`}).join('')}
  </div>`;
}
function fmtLong(x){const m=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const p=x.split('-'); return m[+p[1]-1]+' '+(+p[2])}

/* ── PHONE ────────────────────────────────────────────────
   One panel carries the week. Everything else is a section header
   in the page flow followed by rows. No uppercase micro-labels,
   no cards inside cards. */
function renderPhone(){
  document.body.classList.add('darktop');
  const tier = LOOP.store.tier();
  const r    = LOOP.read(ME, tier);
  const ins  = LOOP.headlines(ME, tier, 1)[0];
  const mom  = LOOP.moment(ME);
  const cn   = LOOP.coins(ME);
  const q    = LOOP.starters(ME, 1, LOOP.store.starterSeed())[0];
  const qkey = q.q.slice(0,40);
  const qdone = !!LOOP.store.talked()[qkey];
  const kid  = FAMILY.find(f=>f.id===ME) || FAMILY[0];
  const msg  = TEACHER_MESSAGES.find(x=>x.s===ME);
  const evt  = EVENTS_UPCOMING.find(x=>x.s===ME);
  const fid  = LOOP.store.focus(ME) || (ins ? ins.dim.id : 'confidence');
  const fdim = DIMENSIONS.find(x=>x.id===fid);
  const pct  = cn.top ? cn.top.pct : 0;

  $('#app').innerHTML = `
    <div class="m-dark">
      <div class="m-brand">
        <svg style="width:17px;height:17px" viewBox="0 0 24 24" aria-hidden="true">
          <g stroke-linecap="round" fill="none">
            <path d="M8 8.5 L18.5 4.2"   stroke="#ffc425" stroke-width="4.2"/>
            <path d="M4.8 13 L14.8 10.4" stroke="#1172ff" stroke-width="4.2"/>
            <path d="M5.6 19 L12.6 17.2" stroke="#5cb0ff" stroke-width="4.2"/>
          </g></svg>
        <span class="lock"><span class="cc">ClassCade</span><span class="lp">Loop</span></span>
        <span class="util">
          <a class="m-bell" href="messages.html">✉️<span class="dot"></span></a>
          <span class="m-me">${esc(PARENT.name[0])}</span>
        </span>
      </div>

      <div class="m-greetrow">
        <div>
          <div class="m-greet">Hi, ${esc(PARENT.name)}! 👋</div>
          <div class="m-greet-sub">Here's ${esc(d.poss)} week.</div>
        </div>
        <div class="m-kidpill" id="kidmenu">
          <div class="av g1" style="width:28px;height:28px;border-radius:9px;font-size:12px">${esc(kid.label[0])}</div>
          <div style="min-width:0"><div class="nm">${esc(kid.label)}</div>
          <div class="mt">${esc(kid.grade)}</div></div>
          <span class="cv">⌄</span>
        </div>
      </div>

      ${ins && !ins.cold ? `
      <div class="m-hero">
        <img class="m-mascot" src="art/loop-monster-sm.png" alt="" width="300" height="331">
        <div class="eyebrow2">${esc(d.first)}'s week at a glance</div>
        <div class="headrow">
          <div class="shield" style="background:${ins.dim.tint}">${dimIcon(ins.dim,26)}</div>
          <div><h2>${esc(ins.head)}</h2></div>
        </div>
        <button class="btn gold" data-go="growth.html?d=${ins.dim.id}">See ${esc(d.poss)} week →</button>
        <div class="m-bottom">
          <div class="m-src2">
          ${tier==='connected'?`<div class="s">
            <div class="hd">🏫 At school</div>
            <div class="stat">${esc(ins.schoolStat||'Nothing flagged')}</div>
          </div>`:''}
          <div class="h">
            <div class="hd">🏠 At home</div>
            <div class="stat">${esc(ins.homeStat||'Nothing logged yet')}</div>
            ${ins.voice?`<div class="qt">"${esc(ins.voice)}"<span class="by">— ${esc(d.first)}</span></div>`:''}
          </div>
          </div>
        </div>
      </div>` : `
      <div class="m-hero">
        <div class="eyebrow2">${esc(d.first)}'s week at a glance</div>
        <h2>Still getting to know ${esc(d.first)}.</h2>
        <div class="sub">Loop waits for a pattern rather than guessing from one moment.</div>
      </div>`}
    </div>

    <div class="m-light">
      ${weekBar()}
      <div class="m-secrow">Add what you noticed</div>
      ${pending ? confirmPanel() : `
      <div class="m-chips">
        ${HOME_OBS.slice(0,6).map(o=>`<button data-obs="${o.id}">${o.emoji} ${esc(o.label)}</button>`).join('')}
      </div>`}
      ${loggedList()}
      <a class="m-row" href="ask.html" style="margin-top:10px">
        <div class="ric" style="background:var(--home-bg)">💬</div>
        <div class="rtx"><div class="rtitle">Something worrying you?</div>
          <div class="rsub">Always here, never behind the paywall</div></div>
        <span class="chev">›</span>
      </a>

      <div class="m-secrow">The Whole Learner <span class="swipe">1 of 6 · swipe</span> <a href="growth.html">View all →</a></div>
      <div class="wl-asof">Read as of ${fmtLong(TODAY)} · a status word only changes on a pattern, never on one moment</div>
      <div class="m-growth" id="wlStrip">
        ${DIMENSIONS.map(dim=>{const x=r[dim.id];return `
          <div class="m-gcard" data-go="growth.html?d=${dim.id}">
            <div class="tile" style="background:${dim.tint}">${dimIcon(dim,22)}</div>
            <div class="nm">${esc(dim.name)}</div>
            <div class="st" style="color:${x.cold?'var(--muted-2)':dim.color}">${LOOP.LEVEL_LABEL[x.level]}${x.cold?'':' '+LOOP.ARROW[x.dir]}</div>
            ${x.cold
              ? `<div class="nobar">Not enough yet</div>`
              : `<div class="bar" role="img" aria-label="${LOOP.LEVEL_LABEL[x.level]}"><i style="width:${x.pct}%;background:${dim.color}"></i></div>`}
          </div>`}).join('')}
      </div>

      <div class="m-duo" style="margin-top:18px">
        <div class="m-tile convo ${justLogged?'flash':''}" id="qcard">
          ${justLogged?`<div class="q-new">✨ New question for tonight, based on what you just noticed</div>`:''}
          <div class="th"><div class="ti" style="background:#e9e2ff">${ico('conversation-bubbles',18)}</div>
            <div class="tl">Tonight's conversation</div></div>
          <div class="tq">${q.grounded?'Instead of “How was school today?”':'Ask tonight'}</div>
          <div class="tp">“${esc(q.q)}”</div>
          <a class="tlink" href="#" data-open-q>See why this matters →</a>
          <img class="art-img" src="art/bubbles-sm.png" alt="" width="200" height="124">
        </div>
        ${tier==='connected' && cn.total ? `
        <div class="m-tile coins">
          <div class="th"><div class="ti" style="background:#d8f3e0">${ico('coins',18)}</div>
            <div class="tl">ClassCade moment</div></div>
          <div class="tq">${esc(d.first)} is earning coins for ${esc((cn.top?cn.top.label:'taking part').toLowerCase())}</div>
          <div class="tp" style="padding-right:0">Coins are Showdown's currency, not Loop's read of ${esc(d.first)}.
            <span class="coinfoot">${cn.total} this week</span></div>
        </div>` : `
        <div class="m-tile moment">
          <div class="th"><div class="ti" style="background:${fdim.tint}">${dimIcon(fdim,18)}</div>
            <div class="tl">Today's moment</div></div>
          <div class="tq">${esc(mom.title)}</div>
          <div class="tp">${esc(mom.prompt)}</div>
        </div>`}
      </div>

      ${tier==='connected' ? '' : `
      <div class="m-secrow">Not connected</div>
      <div class="m-row tall" id="connectRow">
        <div class="ric" style="background:var(--school-bg)">🔗</div>
        <div class="rtx"><div class="rtitle">Connect ${esc(d.first)}'s classroom</div>
          <div class="rsub">Bring what ${esc(d.subj)} already does in Showdown into Loop — no extra work for the teacher.</div></div>
        <span class="chev">›</span>
      </div>`}


      ${evt?`<a class="m-row" href="ask.html#conference">
        <div class="ric" style="background:#fff6d9">📅</div>
        <div class="rtx"><div class="rtitle">${esc(evt.kind)}</div>
          <div class="rsub">${esc(evt.when)} · get questions to ask</div></div>
        <span class="chev">›</span>
      </a>`:''}

      <p class="m-note">Loop shows status words, never scores. It waits for a pattern before it says anything.</p>
    </div>`;

  wire();
  $$('[data-go]').forEach(el2=>el2.onclick=()=>location.href=el2.dataset.go);
  const cr=$('#connectRow'); if(cr) cr.onclick=()=>{ LOOP.store.setTier('connected'); location.reload() };
  const km=$('#kidmenu'); if(km) km.onclick=()=>toast('Only Maya is seeded in this prototype.');
  /* opening Home is reading the week */
  setTimeout(()=>{ if (LOOP.store.isNew('digest|'+WEEK_START)){
    LOOP.store.markSeen('digest|'+WEEK_START); LOOP.store.ritualDone('read'); } }, 1200);

  /* pick → confirm → commit, then show the parent what changed */
  $$('[data-obs]').forEach(b=>b.onclick=()=>{ pending=b.dataset.obs; render();
    requestAnimationFrame(()=>$('#obsNote')&&$('#obsNote').focus()) });
  const oc=$('#obsCancel'); if(oc) oc.onclick=()=>{ pending=null; render() };
  const on=$('#obsNote'); if(on) on.oninput=()=>{ const c=$('#obsCount'); if(c) c.textContent=on.value.length };
  const os=$('#obsSave'); if(os) os.onclick=()=>{
    const entry = LOOP.store.addHome(ME, pending, $('#obsNote').value);
    LOOP.store.ritualDone('notice');
    pending=null; justLogged=true; render();
    /* the payoff is the point — take the parent to the thing that changed */
    setTimeout(()=>{
      const card=$('#qcard');
      if(card){
        const y = Math.max(0, card.getBoundingClientRect().top + window.scrollY - window.innerHeight*0.32);
        window.scrollTo({ top:y, behavior:'smooth' });
        /* smooth scroll is dropped in some embedded browsers — guarantee arrival */
        setTimeout(()=>{ if (Math.abs(window.scrollY - y) > 40) window.scrollTo(0, y) }, 420);
      }
      toastUndo('Added to '+d.first+"'s day", ()=>{ LOOP.store.removeHome(entry.id); justLogged=false; render() });
    }, 80);
    setTimeout(()=>{ justLogged=false; }, 6000);
  };
  $$('[data-del]').forEach(b=>b.onclick=()=>{
    LOOP.store.removeHome(b.dataset.del); toast('Removed.'); render();
  });
  const oq=$('[data-open-q]'); if(oq) oq.onclick=e=>{ e.preventDefault(); toast(q.why) };
}

function fmtShort(s){ const m=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const p=s.split('-'); return m[+p[1]-1]+' '+(+p[2]) }

function renderDesktop(){
  document.body.classList.remove('darktop');   /* phone-only header treatment */
  const tier = LOOP.store.tier();
  const r    = LOOP.read(ME, tier);
  const ins  = LOOP.headlines(ME, tier, 1)[0];
  const mom  = LOOP.moment(ME);
  const cn   = LOOP.coins(ME);

  $('#app').innerHTML = `
    ${topline(`Here's what's happening with ${esc(d.first)}.`)}
    <div class="dash">
      <div>
        <div class="mo-1">${hero(ins, tier)}</div>
        <div class="mo-3">${startersCard()}</div>

        <div class="mo-4">
        <div class="wl-head">
          <h3>The Whole Learner</h3>
          <span class="chip plain tiny" title="${esc(LANGUAGE.rule)}">?</span>
          <span class="spacer"></span>
          <a href="growth.html" class="small">View all growth →</a>
        </div>
        <div class="wl-row">${DIMENSIONS.map(dim=>wlCard(r[dim.id])).join('')}</div>
        </div>

        <div class="duo mo-6">
          ${momentCard(mom)}
          ${tier==='connected' ? coinCard(cn) : normalCard(r)}
        </div>

        
      </div>

      <div class="rail">
        <div class="mo-2">${focusCard(r)}</div>
        <div class="mo-5">${addFromHome()}</div>
        <div class="mo-8">${tier==='connected' ? eventCard() : ''}</div>
        <div class="mo-9">${tier==='connected' ? messageCard() : ''}</div>
        <div class="mo-10">${tier==='family' ? connectCard() : ''}</div>
      </div>
    </div>`;

  wireTopline();
  wire();
}

/* ── hero: the week at a glance ───────────────────────── */
function hero(ins, tier){
  if (!ins || ins.cold) return `
    <div class="hero-card"><div class="hero-grid"><div>
      <div class="hero-eyebrow">${esc(d.first)}'s week at a glance</div>
      <h2>Still getting to know ${esc(d.first)}.</h2>
      <p>Loop waits for a pattern rather than guessing from one moment. Log what you notice and it fills in quickly.</p>
    </div></div></div>`;

  return `
  <div class="hero-card">
    <div class="hero-grid">
      <div>
        <div class="hero-eyebrow">${esc(d.first)}'s week at a glance</div>
        <div style="display:flex;align-items:flex-start;gap:13px">
          <div class="dim-ico lg" style="background:${ins.dim.tint};box-shadow:none">${dimIcon(ins.dim,26)}</div>
          <div>
            <h2>${esc(ins.head)}</h2>
            <p class="hide-sm">${esc(ins.why)}</p>
          </div>
        </div>
        <a class="btn gold sm" style="margin-top:16px" href="growth.html?d=${ins.dim.id}">See ${esc(d.poss)} week →</a>
      </div>
      <div class="hero-side" style="${tier==='family'?'grid-template-columns:1fr':''}">
        ${tier==='family' ? '' : `<div class="hero-src s">
          <div class="hd">🏫 At school</div>
          <div class="stat">${ins.schoolStat ? esc(ins.schoolStat) : 'Nothing flagged this week.'}</div>
          ${messageQuote()}
        </div>`}
        <div class="hero-src h">
          <div class="hd">🏠 At home</div>
          <div class="stat">${ins.homeStat ? esc(ins.homeStat) : 'Nothing logged yet this week.'}</div>
          ${ins.voice?`<div class="hero-quote">“${esc(ins.voice)}”<span class="by">— ${esc(d.first)}, told to you</span></div>`:''}
        </div>
      </div>
    </div>
  </div>`;
}
function messageQuote(){
  const m = TEACHER_MESSAGES.find(x=>x.s===ME);
  if (!m || LOOP.store.tier()!=='connected') return '';
  return `<div class="hero-quote">“${esc(m.body.split('.')[0])}.”<span class="by">— ${esc(m.from)}</span></div>`;
}

/* ── instead of "how was school today?" ─────────────────
   One question. Not three. A parent standing in a kitchen at 5pm can hold
   exactly one thing — give them the best one and a button to reroll. */
function startersCard(){
  const seed = LOOP.store.starterSeed();
  const x = LOOP.starters(ME, 1, seed)[0];
  const key = x.q.slice(0,40);
  const done = !!LOOP.store.talked()[key];
  return `
  <div class="starters">
    <div class="mini-lbl">Tonight's conversation</div>
    <h3 style="font-size:20px;margin:5px 0 16px">
      Instead of <span class="strike">&ldquo;How was school today?&rdquo;</span></h3>

    <div class="q-hero ${done?'done':''}">
      ${x.grounded
        ? `<div class="because ${x.src==='home'?'home':''}">
             ${x.src==='school'?'🏫 Because at school:':'🏠 Because at home:'} ${esc(x.because)}</div>`
        : `<div class="because plain">Always works</div>`}
      <div class="qq">&ldquo;${esc(x.q)}&rdquo;</div>
      <div class="followq">Then: &ldquo;${esc(x.follow)}&rdquo;</div>
      <div class="acts">
        <button class="btn sm ${done?'sel':''}" data-talked="${esc(key)}">
          <span class="hide-sm">${done?'✓ We talked about this':'We talked about this'}</span>
          <span class="show-sm">${done?'✓ Talked':'We talked'}</span></button>
        <button class="btn sm ghost" id="shuffleQ">
          <span class="hide-sm">↻ Another question</span>
          <span class="show-sm">↻ Another</span></button>
      </div>
    </div>

    <details class="fold">
      <summary>Why this one</summary>
      <div class="foldbody">
        <p class="small muted" style="margin-bottom:10px">${esc(x.why)}</p>
        <ul class="small muted">
          ${STARTER_WHY_THIS_WORKS.map(w=>`<li>${esc(w)}</li>`).join('')}
        </ul>
      </div>
    </details>
  </div>`;
}

/* ── today's 5-minute moment ──────────────────────────── */
function momentCard(m){
  return `
  <div class="card">
    <div class="mini-head">
      <div class="mini-ico" style="background:${m.dim.tint}">💬</div>
      <div><div class="mini-lbl">Today's 5-minute moment</div>
      <h4 style="margin-top:1px">${esc(m.title)}</h4></div>
    </div>
    <p style="font-size:14.5px;font-weight:700">${esc(m.prompt)}</p>
    <details class="fold" ${wide()?'open':''} style="margin-top:11px">
      <summary>Why it matters · what to say next</summary>
      <div class="foldbody">
        <p class="small" style="margin-bottom:9px">${esc(m.why)}</p>
        <p class="small muted">If it lands, follow with: <strong>${esc(m.follow)}</strong></p>
      </div>
    </details>
    <button class="btn sm ghost" style="margin-top:12px" id="momentDone">✓ We did this</button>
  </div>`;
}

/* ── Showdown economy ─────────────────────────────────── */
function coinCard(cn){
  if (!cn.total) return `<div class="card tinted"><div class="mini-lbl">ClassCade moment</div>
    <p class="small muted" style="margin-top:8px">No coins yet this week.</p></div>`;
  const pct = cn.top ? cn.top.pct : 0;
  return `
  <div class="card">
    <div class="mini-head">
      ${bog(LOOP.store.boggie(ME),'sm','ring')}
      <div><div class="mini-lbl">ClassCade moment</div>
      <h4 style="margin-top:1px">${esc(d.first)} earned ${cn.total} coins this week</h4></div>
    </div>
    <div style="display:flex;align-items:center;gap:15px;margin-top:6px">
      <div class="donut" style="background:conic-gradient(#108b2f ${pct*3.6}deg, #e9f0fb 0)">
        <div style="width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center">
          <span>${pct}%</span></div>
      </div>
      <div style="min-width:0">
        <div style="font-weight:800">From ${esc(cn.top?cn.top.label:'—')}</div>
        <p class="small muted hide-sm" style="margin-top:4px">Coins are Showdown's currency, not Loop's read. They're here because ${esc(d.subj)}'ll mention them at dinner.</p>
        <p class="tiny muted show-sm" style="margin-top:3px">Showdown's currency, not Loop's read.</p>
      </div>
    </div>
  </div>`;
}

/* "Is this normal?" — answered without ranking anyone. */
function normalCard(r){
  const fid = LOOP.store.focus(ME) || (LOOP.headlines(ME,null,1)[0]||{}).dim?.id || 'confidence';
  const dim = DIMENSIONS.find(x=>x.id===fid);
  const exp = LOOP.expectations(fid, 3);
  return `
  <div class="card">
    <div class="mini-head">
      <div class="mini-ico" style="background:${dim.tint}">${dimIcon(dim,17)}</div>
      <div><div class="mini-lbl">Is this normal?</div>
      <h4 style="margin-top:1px">${esc(dim.name)} in 3rd grade</h4></div>
    </div>
    <p style="font-size:14.5px">${esc(exp||'')}</p>
    <a class="link" href="ask.html">See what else is typical at this age →</a>
  </div>`;
}

function familyCard(){
  return `
  <div class="card">
    <div class="mini-head">
      <div class="mini-ico" style="background:var(--home-bg)">🏠</div>
      <div><div class="mini-lbl">Add what you noticed</div>
      <h4 style="margin-top:1px">One tap. That's the whole ask.</h4></div>
    </div>
    <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:8px">
      ${HOME_OBS.slice(0,6).map(o=>`<button class="btn sm" data-obs="${o.id}">${o.emoji} ${esc(o.label)}</button>`).join('')}
    </div>
  </div>`;
}

/* ── what happened at school ──────────────────────────── */
function feedCard(){
  const small = !wide();
  const total = LOOP.activity(ME, 40).length;
  const rows = LOOP.activity(ME, small ? 4 : 6);
  return `
  <details class="fold card" ${wide()?'open':''} style="margin-top:14px;background:#fff;box-shadow:var(--shadow)">
    <summary>What happened at school · ${total}</summary>
    <div class="foldbody">
    <table class="feed">
      ${rows.map(x=>`<tr>
        <td class="dt">${fmt(x.d)}</td>
        <td style="width:32px"><span style="font-size:15px">${x.sig.emoji}</span></td>
        <td class="sg" style="color:${x.v<0?'var(--watch)':'var(--ink)'}">${esc(x.sig.label)}</td>
        <td class="muted">${esc(x.detail)}</td>
        <td class="who">Ms. Alvarez</td>
        <td style="text-align:right">${x.coins?`<span class="coin">⊙ +${x.coins}</span>`:'<span class="tiny muted">—</span>'}</td>
      </tr>`).join('')}
    </table>
    <p class="tiny muted" style="margin-top:12px">
      Showing ${rows.length} of ${total}. Captured while ${esc(d.first)}'s teacher ran Showdown normally — nobody filled anything out.
      <a href="school.html">See everything →</a></p>
    </div>
  </details>`;
}
function fmt(s){ const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const p=s.split('-'); return m[+p[1]-1]+' '+(+p[2]) }

/* ── right rail ───────────────────────────────────────── */
function focusCard(r){
  const fid = LOOP.store.focus(ME) || (LOOP.headlines(ME,null,1)[0]||{}).dim?.id || 'confidence';
  const dim = DIMENSIONS.find(x=>x.id===fid);
  const n = NARRATIVE[fid][r[fid].cold?'flat':r[fid].dir];
  return `
  <div class="card" style="border-color:${dim.color}33">
    <div class="mini-head">
      <div class="mini-ico" style="background:${dim.tint}">${dimIcon(dim,17)}</div>
      <div class="lbl" style="color:${dim.color}">Today's focus</div>
    </div>
    <h4>${esc(dim.name)}</h4>
    <p>${esc(n.tryAt(d))}</p>
    <a class="link" href="growth.html?d=${fid}">See ideas to try today →</a>
  </div>`;
}
function eventCard(){
  const e = EVENTS_UPCOMING.find(x=>x.s===ME); if(!e) return '';
  return `
  <div class="card" style="background:#fffdf4;border-color:rgba(255,196,37,.4)">
    <div class="mini-head"><div class="mini-ico" style="background:#fff6d9">📅</div>
      <div class="lbl" style="color:#8a6400">Upcoming</div></div>
    <h4>${esc(e.kind)}</h4>
    <p>${esc(e.when)}</p>
    <a class="link" href="ask.html#conference">Get questions to ask →</a>
  </div>`;
}
function messageCard(){
  const m = TEACHER_MESSAGES.find(x=>x.s===ME); if(!m) return '';
  return `
  <div class="card">
    <div class="mini-head"><div class="mini-ico" style="background:var(--school-bg)">🧑‍🏫</div>
      <div class="lbl" style="color:var(--school)">Message from ${esc(m.from)}</div></div>
    <p style="color:var(--ink)">${esc(m.body)}</p>
    <a class="link" href="#" data-reply>Reply to ${esc(m.from)} →</a>
  </div>`;
}
function addFromHome(){
  const logged = LOOP.store.homeObs().filter(o=>o.s===ME && o.user).length;
  return `
  <div class="card" style="background:var(--home-bg);border-color:rgba(14,147,132,.25)">
    <div class="mini-head"><div class="mini-ico" style="background:#fff">➕</div>
      <div class="lbl" style="color:var(--home)">Add something from home</div></div>
    <h4>Notice something we should know?</h4>
    <p class="hide-sm">Your insight helps us give a more complete picture of ${esc(d.poss)} growth.</p>
    <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:11px">
      ${HOME_OBS.slice(0,4).map(o=>`<button class="btn sm" data-obs="${o.id}">${o.emoji} ${esc(o.label)}</button>`).join('')}
    </div>
    <a class="link" href="ask.html">Or tell us what's worrying you →</a>
    ${logged?`<div class="tiny muted" style="margin-top:9px">${logged} logged this week</div>`:''}
  </div>`;
}
function connectCard(){
  return `
  <div class="connect">
    <div class="hero-eyebrow">Want a fuller picture?</div>
    <h3 style="font-size:18px;margin-bottom:8px;color:#fff">Connect ${esc(d.first)}'s classroom.</h3>
    <p style="font-size:13.5px;margin-bottom:13px">If ${esc(d.poss)} teacher uses ClassCade, everything ${esc(d.subj)} already does in Showdown starts feeding in — with no extra work for the teacher.</p>
    <button class="btn gold sm" id="connectBtn">🔗 Connect classroom</button>
  </div>`;
}

/* ── interaction ──────────────────────────────────────── */
function wire(){
  $$('[data-dim]').forEach(c=>c.onclick=()=>location.href='growth.html?d='+c.dataset.dim);
  const md = $('#momentDone'); if(md) md.onclick=()=>toast('Nice. That’s the whole habit.');
  const sq = $('#shuffleQ'); if(sq) sq.onclick=()=>{ LOOP.store.bumpStarterSeed(); render() };
  $$('[data-talked]').forEach(b=>b.onclick=()=>{
    const on = LOOP.store.toggleTalked(b.dataset.talked);
    if (on) LOOP.store.ritualDone('talk');
    if (on) toast('Logged. That’s the ritual — one question, then listen.');
    render();
  });
  const rp = $('[data-reply]'); if(rp) rp.onclick=e=>{e.preventDefault();location.href='growth.html'};
  const c = $('#connectBtn'); if(c) c.onclick=()=>{ LOOP.store.setTier('connected'); location.reload() };
}

mountApp('home');
render();
</script>
</body></html>
