<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ask · ClassCade Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="loop.css?v=132">
<style>
  .big-ask{
    border-radius:22px;padding:26px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-lg);
  }
  .big-ask input{
    width:100%;border:0;font:inherit;font-size:17px;font-weight:700;padding:15px 17px;border-radius:15px;
    background:var(--tint);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)
  }
  .big-ask input:focus{outline:2px solid rgba(7,93,250,.32);outline-offset:1px}
  .concern-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:14px}
  @media(max-width:1180px){.concern-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .concern{
    text-align:left;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:13.5px;letter-spacing:-.015em;
    background:var(--tint);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);
    border-radius:14px;padding:13px 14px;display:flex;flex-direction:column;gap:7px
  }
  .concern:hover{background:#fff;box-shadow:inset 0 0 0 2px var(--blue);color:var(--blue)}
  .concern .e{font-size:19px}
  .ans-sec{padding:15px 0}
  .ans-sec + .ans-sec{border-top:1px solid var(--line-soft)}
  .ans-sec ul{margin:6px 0 0;padding-left:19px;line-height:1.7}
  .safety{
    border-radius:16px;padding:16px 18px;background:#fff6f2;box-shadow:inset 0 0 0 1px rgba(200,80,30,.18)
  }
  .safety a{color:#b4400a}
</style>
</head><body>
<div id="app"></div>
<script src="loop.data.js?v=132"></script>
<script src="loop.engine.js?v=132"></script>
<script src="loop.shell.js?v=132"></script>
<script>
const d = LOOP.child(ME);
let open = null, query = '';

function render(){
  if (document.body.classList.contains('sm')) return renderPhone();
  return renderDesktop();
}

function brandRow(){
  return `<div class="m-brand">
    <svg style="width:17px;height:17px" viewBox="0 0 24 24" aria-hidden="true"><g stroke-linecap="round" fill="none">
      <path d="M8 8.5 L18.5 4.2" stroke="#ffc425" stroke-width="4.2"/>
      <path d="M4.8 13 L14.8 10.4" stroke="#1172ff" stroke-width="4.2"/>
      <path d="M5.6 19 L12.6 17.2" stroke="#5cb0ff" stroke-width="4.2"/></g></svg>
    <span class="lock"><span class="cc">ClassCade</span><span class="lp">Loop</span></span>
    <span class="util"><a class="m-bell" href="messages.html">${ico('nav-notifications',20)}</a>
    <span class="m-me">${esc(PARENT.name[0])}</span></span></div>`;
}

function renderPhone(){
  document.body.classList.add('darktop');
  const kid = FAMILY.find(f=>f.id===ME) || FAMILY[0];
  const c   = open ? LOOP.concern(open) : null;
  const qs  = LOOP.conference(ME, LOOP.store.tier());
  const evt = EVENTS_UPCOMING.find(x=>x.s===ME);
  const hits = filterConcerns(query);

  $('#app').innerHTML = `
    <div class="m-dark">
      ${brandRow()}
      <div class="m-greetrow">
        <div><div class="m-greet">Hi, ${esc(PARENT.name)}! 👋</div>
        <div class="m-greet-sub">Whatever you're wondering — start here.</div></div>
        <div class="m-kidpill" id="kidmenu">
          <div class="av g1" style="width:28px;height:28px;border-radius:9px;font-size:12px">${esc(kid.label[0])}</div>
          <div style="min-width:0"><div class="nm">${esc(kid.label)}</div><div class="mt">${esc(kid.grade)}</div></div>
          <span class="cv">⌄</span>
        </div>
      </div>
    </div>

    <div class="m-light">
      <!-- crisis first. A parent in an acute moment will not scroll. -->
      <a class="a-urgentbar" href="#urgent">
        <span class="ub-ic">🚩</span>
        <span class="ub-tx"><b>Need help right now?</b><span>988 · Childhelp · Crisis Text Line — free, 24/7</span></span>
        <span class="cv">›</span>
      </a>

      <div class="a-hero">
        <img class="mon" src="art/loop-monster-sm.png" alt="">
        <span class="pill">Always here · never behind the paywall</span>
        <h2>I'm noticing something…</h2>
        <p>Tell us what you're seeing, in your own words.</p>
        <div class="a-search">
          <svg style="width:17px;height:17px;flex:none;color:var(--muted-2)" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          <input id="q" value="${esc(query)}" placeholder="e.g. anxious about math tests" autocomplete="off"
                 aria-label="Describe what you're noticing">
          ${query?`<button class="a-clear" id="clearQ" aria-label="Clear">✕</button>`:''}
        </div>
        ${query ? `<div class="a-hint">${hits.length
            ? `Closest ${hits.length===1?'match':'matches'} below`
            : `Nothing in the library matches that yet — the closest we have is <b>${esc(nearest(query).label)}</b>.`}</div>` : ''}
      </div>

      ${c ? `
      <button class="a-back" id="backAll">‹ All topics</button>
      <div class="a-ans" id="answer">
        <div class="a-anshead">
          <span class="e">${c.emoji}</span>
          <span><span class="lbl2">You said</span><b>${esc(c.label)}</b></span>
        </div>
        <div class="sec">
          <div class="lbl">What this might mean</div>
          <p>${esc(c.mean)}</p>
        </div>
        <div class="sec">
          <div class="lbl">What to watch for</div>
          <ul>${c.watch.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>
        </div>
        <div class="sec">
          <div class="lbl" style="color:var(--home)">One small next step</div>
          <p>${esc(c.step)}</p>
        </div>
        <div class="sec">
          <div class="lbl" style="color:var(--watch)">When to ask for more help</div>
          <p>${esc(c.seek)}</p>
          <a class="a-seek" href="#urgent">🚩 See crisis lines and who to call ›</a>
          <p class="tiny muted" style="margin-top:9px">Loop is a parenting tool, not a clinical one. It never diagnoses.</p>
        </div>
      </div>` : `
      <div class="a-grid">
        ${(hits.length?hits:CONCERNS).map(x=>`<button class="a-row" data-c="${x.id}">
          <span class="e">${x.emoji}</span><span class="t">${esc(x.label)}</span>
        </button>`).join('')}
      </div>
      ${!hits.length && query ? `<button class="btn ghost block" style="margin-top:10px" data-c="${nearest(query).id}">
        Open “${esc(nearest(query).label)}” instead</button>` : ''}
      `}

      <div class="m-secrow">Conference questions</div>
      <div class="a-conf">
        <div class="lbl">Conference question generator</div>
        <h3>Walk in with something better than “how's she doing?”</h3>
        ${evt?`<p class="small muted" style="margin-top:6px">${esc(evt.kind)} · ${esc(evt.when)}</p>`:''}
        <div style="margin-top:8px">
          ${qs.length ? qs.map(z=>`<div class="a-q">
            <span class="lb" style="color:${z.dim.color}">${esc(z.dim.name)}</span>
            <span class="tx">${esc(z.q)}</span></div>`).join('')
            : '<p class="small muted">Not enough signal yet to build questions worth asking.</p>'}
        </div>
        <button class="btn sm ghost block" style="margin-top:12px" id="copyQ">Copy questions</button>
      </div>

      <div class="m-secrow" id="urgent">If it's urgent</div>
      <div class="a-urgent">
        <div class="lbl">🚩 Free, 24/7, no account needed</div>
        <p class="small">Some things shouldn't wait for a weekly pattern.</p>
        ${CRISIS.map(x=>`<div class="a-crisis">
          <div style="flex:1;min-width:0"><b>${esc(x.label)}</b><span>${esc(x.detail)}</span></div>
          <span class="cv" style="color:var(--muted-2);font-weight:900">›</span></div>`).join('')}
      </div>

      <details class="g-fold" style="margin-top:12px">
        <summary><span class="fi" style="background:var(--tint)">💬</span>Why Loop works this way</summary>
        <div class="fb">
          <p class="small" style="margin-bottom:9px">Status words only, never numbers. Describe the child, never rank them.</p>
          <div>${LANGUAGE.use.map(w=>`<span class="chip good" style="margin:0 5px 5px 0">${esc(w)}</span>`).join('')}</div>
          <div style="margin-top:5px">${LANGUAGE.never.map(w=>`<span class="chip plain" style="margin:0 5px 5px 0;text-decoration:line-through;opacity:.55">${esc(w)}</span>`).join('')}</div>
        </div>
      </details>
    </div>`;

  wireTopline();
  $$('[data-c]').forEach(b=>b.onclick=()=>{
    open = b.dataset.c; query=''; render();
    requestAnimationFrame(()=>{ const a=$('#answer'); if(a) a.scrollIntoView({behavior:'smooth',block:'start'}) });
  });
  const back=$('#backAll'); if(back) back.onclick=()=>{ open=null; render(); window.scrollTo({top:0,behavior:'smooth'}) };
  const cl=$('#clearQ'); if(cl) cl.onclick=()=>{ query=''; render(); $('#q')&&$('#q').focus() };
  const cq=$('#copyQ'); if(cq) cq.onclick=()=>{
    const t = LOOP.conference(ME, LOOP.store.tier()).map(z=>`• ${z.dim.name}: ${z.q}`).join('\n');
    navigator.clipboard?.writeText(t); toast('Questions copied.');
  };
  const qi=$('#q');
  if(qi){
    qi.oninput = ()=>{ query = qi.value; const pos=qi.selectionStart; render();
      const n=$('#q'); if(n){ n.focus(); try{n.setSelectionRange(pos,pos)}catch(e){} } };
    qi.onkeydown = e=>{ if(e.key!=='Enter') return;
      const h = filterConcerns(qi.value);
      open = (h[0]||nearest(qi.value)).id; query=''; render();
      requestAnimationFrame(()=>{ const a=$('#answer'); if(a) a.scrollIntoView({behavior:'smooth',block:'start'}) });
    };
  }
}

/* live filter over the topic library, plus a nearest-match fallback so
   describing a child in your own words is never the wrong move */
function filterConcerns(qq){
  const t = (qq||'').trim().toLowerCase();
  if (!t) return [];
  return CONCERNS.filter(c=>{
    const hay = (c.label+' '+c.id.replace(/_/g,' ')+' '+c.mean+' '+c.watch.join(' ')).toLowerCase();
    return t.split(/\s+/).filter(w=>w.length>2).some(w=>hay.includes(w));
  });
}
function nearest(qq){
  const t=(qq||'').toLowerCase();
  let best=CONCERNS[0], score=-1;
  CONCERNS.forEach(c=>{
    const hay=(c.label+' '+c.mean).toLowerCase();
    const n = t.split(/\s+/).filter(w=>w.length>2).reduce((a,w)=>a+(hay.includes(w)?1:0),0);
    if (n>score){ score=n; best=c }
  });
  return best;
}

function renderDesktop(){
  document.body.classList.remove('darktop');
  $('#app').innerHTML = `
    ${topline(`Whatever you're wondering about ${esc(d.first)} — start here.`, 'Ask')}
    <div class="dash">
      <div class="stack">
        <div class="big-ask">
          <div class="eyebrow" style="margin-bottom:13px">Always here · never behind the paywall</div>
          <h2 style="margin-bottom:6px">I'm noticing something…</h2>
          <p class="muted" style="margin-bottom:16px;max-width:60ch">Tell us what you're seeing. You'll get what it might mean, what to watch for, one small next step, and when it's worth asking someone else.</p>
          <input id="q" placeholder="e.g. “meltdowns after school”, “won't read anymore”" autocomplete="off">
          <div class="concern-grid">
            ${CONCERNS.map(c=>`<button class="concern ${open===c.id?'sel':''}" data-c="${c.id}">
              <span class="e">${c.emoji}</span>${esc(c.label)}</button>`).join('')}
          </div>
        </div>
        ${open ? answer(LOOP.concern(open)) : ''}
        ${conferenceCard()}
      </div>
      <div class="rail">
        <div class="safety">
          <div class="lbl" style="font-size:10.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#b4400a;margin-bottom:7px">If it's urgent</div>
          <p class="small" style="color:var(--ink)">Some things shouldn't wait for a weekly pattern. These are free, 24/7, and you don't need an account.</p>
          <div style="margin-top:11px">
            ${CRISIS.map(c=>`<div style="margin-bottom:9px">
              <div style="font-weight:900;font-size:13.5px">${esc(c.label)}</div>
              <div class="small muted">${esc(c.detail)}</div></div>`).join('')}
          </div>
        </div>
        <div class="card tinted">
          <div class="lbl" style="font-size:10.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:7px">How Loop talks</div>
          <p class="small">${esc(LANGUAGE.rule)}</p>
          <div style="margin-top:10px">
            ${LANGUAGE.use.slice(0,5).map(w=>`<span class="chip good tiny" style="margin:0 4px 4px 0">${esc(w)}</span>`).join('')}
          </div>
          <div style="margin-top:8px">
            ${LANGUAGE.never.slice(0,5).map(w=>`<span class="chip plain tiny" style="margin:0 4px 4px 0;text-decoration:line-through;opacity:.6">${esc(w)}</span>`).join('')}
          </div>
        </div>
      </div>
    </div>`;
  wireTopline();
  $$('[data-c]').forEach(b=>b.onclick=()=>{ open = open===b.dataset.c ? null : b.dataset.c; render();
    const a=$('#answer'); if(a) a.scrollIntoView({behavior:'smooth',block:'center'}) });
  const q=$('#q');
  q.onkeydown=e=>{ if(e.key!=='Enter') return;
    const t=q.value.toLowerCase();
    const hit = CONCERNS.find(c=>c.label.toLowerCase().split(/\W+/).some(w=>w.length>3&&t.includes(w)))
             || CONCERNS.find(c=>c.id.split('_').some(w=>t.includes(w)));
    if (hit){ open=hit.id; render() } else toast('Nothing matched in the prototype library — pick one below.');
  };
}

function answer(c){
  const dims = c.dims.map(id=>DIMENSIONS.find(x=>x.id===id));
  return `
  <div class="card" id="answer">
    <div class="card-head" style="align-items:flex-start">
      <div class="dim-ico lg">${c.emoji}</div>
      <div style="flex:1">
        <div class="sec-label" style="margin:0">You said</div>
        <h3 style="font-size:21px">${esc(c.label)}</h3>
        <div style="margin-top:7px">${dims.map(x=>`<span class="chip" style="background:${x.tint};color:${x.color};margin-right:5px">${x.ico} ${esc(x.name)}</span>`).join('')}</div>
      </div>
    </div>

    <div class="ans-sec">
      <div class="mini-lbl">What this might mean</div>
      <p style="margin-top:5px;font-size:14.5px">${esc(c.mean)}</p>
    </div>
    <div class="ans-sec">
      <div class="mini-lbl">What to watch for</div>
      <ul class="small">${c.watch.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>
    </div>
    <div class="ans-sec">
      <div class="callout try"><div class="lbl">One small next step</div>${esc(c.step)}</div>
    </div>
    <div class="ans-sec">
      <div class="callout" style="background:#fdf1e3;box-shadow:inset 0 0 0 1px rgba(180,83,10,.2)">
        <div class="lbl" style="color:var(--watch)">When to ask for more help</div>${esc(c.seek)}
      </div>
      <p class="tiny muted" style="margin-top:9px">Loop is a parenting tool, not a clinical one. It never diagnoses, and it will always tell you when something is worth a real conversation with a pediatrician or school counselor.</p>
    </div>

    ${LOOP.store.tier()==='connected' ? `
    <div class="hairline"></div>
    <div class="sec-label">Want ${esc(d.poss)} teacher to know you're thinking about this?</div>
    <button class="btn sm" data-tell="${c.id}">💬 Send “I'd like to talk about this”</button>` : ''}
  </div>`;
}

function conferenceCard(){
  const qs = LOOP.conference(ME, LOOP.store.tier());
  const e = EVENTS_UPCOMING.find(x=>x.s===ME);
  return `
  <div class="card" id="conference">
    <div class="mini-head">
      <div class="mini-ico" style="background:#fff6d9">📅</div>
      <div><div class="mini-lbl">Conference question generator</div>
      <h4 style="margin-top:1px">Walk in with something better than “how's she doing?”</h4></div>
    </div>
    ${e?`<p class="small muted" style="margin-bottom:12px">${esc(e.kind)} · ${esc(e.when)}</p>`:''}
    ${qs.length ? qs.map(q=>`
      <div class="src" style="align-items:flex-start">
        <div class="src-key" style="color:${q.dim.color};width:96px">${esc(q.dim.name)}</div>
        <div class="src-body">${esc(q.q)}</div>
      </div>`).join('')
      : '<p class="small muted">Not enough signal yet to build questions worth asking.</p>'}
    <button class="btn sm ghost" style="margin-top:13px" id="copyQ">Copy questions</button>
  </div>`;
}

function wireExtra(){
  const cq=$('#copyQ'); if(cq) cq.onclick=()=>{
    const t = LOOP.conference(ME, LOOP.store.tier()).map(q=>`• ${q.dim.name}: ${q.q}`).join('\n');
    navigator.clipboard?.writeText(t); toast('Questions copied.');
  };
  $$('[data-tell]').forEach(b=>b.onclick=()=>{
    const c = LOOP.concern(b.dataset.tell);
    LOOP.store.respond(`${ME}|${c.dims[0]}|${WEEK_START}`, 'talk', c.label);
    toast('Sent. Ms. Alvarez sees it on her class view.');
  });
}

const _r = render;
render = function(){ _r(); wireExtra() };

mountApp('ask');
render();
</script>
</body></html>
